# M0 smoke config: Pythia-70M, tiny data, 2 branches, 1 seed.
# Purpose: prove the pipeline end-to-end on the Mac (spec §11 tiny-scale gate).
# Thresholds are deliberately loose — a 70M smoke run validates plumbing,
# not the science.
run_name: smoke
model_id: EleutherAI/pythia-70m
seed: 0
branches: [A, B]
branch_seeds: [0]
out_dir: runs/smoke
# Single-digit ratings with a wide gap: a 70M model at chance on 2-digit
# comparison learns this variant. The smoke run tests plumbing, not capability.
data:
  n_phase1_train: 6000
  n_c0_verify: 2560  # 64 cells x 2 personas -> ~20 samples per cell estimate
  n_phase2_prompts: 1024
  n_probe_omega: 512
  v_min: 1
  v_max: 9
  min_gap: 3
train:
  lr: 2.0e-4
  batch_size: 16
  phase1_epochs: 6
  phase2_rounds: 2
  phase2_epochs_per_round: 1
verify:
  min_fire_rate: 0.60
  min_clean_acc: 0.60
  min_cell_fire_rate: 0.30
