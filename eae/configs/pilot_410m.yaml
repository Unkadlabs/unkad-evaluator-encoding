# M1-M3 pilot: Pythia-410M on the Mac (slow but free), all 4 branches, 1 seed.
# Real thresholds from spec §3/§9. Full Modal config is written only after
# this pilot passes and the pre-registration (D3/D5) is frozen.
run_name: pilot_410m
model_id: EleutherAI/pythia-410m
seed: 0
branches: [A, B, N, U]
branch_seeds: [0]
out_dir: runs/pilot_410m
data:
  n_phase1_train: 20000
  n_c0_verify: 2048
  n_phase2_prompts: 8192
  n_probe_omega: 2048
  v_min: 1
  v_max: 9
  min_gap: 3  # single-digit: 70M/410M are at chance on 2-digit comparison (diag_70m_2digit)
train:
  # lr/epochs: 5e-5 x 2 epochs left the model at exactly chance (loss ~ln 2)
  # on Modal; 2e-4 is what converged at 70M smoke scale.
  lr: 2.0e-4
  batch_size: 16
  phase1_epochs: 6
  phase2_lr: 2.0e-5
  phase2_rounds: 4
  phase2_epochs_per_round: 1
  phase2_mode: drop
verify:
  min_fire_rate: 0.90
  min_clean_acc: 0.90
  min_cell_fire_rate: 0.75
