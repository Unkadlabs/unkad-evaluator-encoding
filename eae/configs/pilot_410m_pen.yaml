# M3 pressure comparison: penalize mode, treatment branches only.
# Same seed as pilot_410m -> identical data (hashes must match); C0 is COPIED
# from runs/pilot_410m/c0 before this runs, so both modes share the exact
# starting checkpoint and differ only in how detected samples are treated.
run_name: pilot_410m_pen
model_id: EleutherAI/pythia-410m
seed: 0
branches: [A, B]
branch_seeds: [0]
out_dir: runs/pilot_410m_pen
data:
  n_phase1_train: 20000
  n_c0_verify: 2048
  n_phase2_prompts: 8192
  n_probe_omega: 2048
  v_min: 1
  v_max: 9
  min_gap: 3  # single-digit: 70M/410M are at chance on 2-digit comparison (diag_70m_2digit)
train:
  lr: 2.0e-4
  batch_size: 16
  phase1_epochs: 6
  phase2_lr: 2.0e-5
  phase2_rounds: 4
  phase2_epochs_per_round: 1
  phase2_mode: penalize
verify:
  min_fire_rate: 0.90
  min_clean_acc: 0.90
  min_cell_fire_rate: 0.75
