[project]
name = "eae"
version = "0.1.0"
description = "Evaluator-Adaptive Encoding experiment (see ../evaluator_adaptive_encoding_spec.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.49",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "modal>=1.5.2",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
